# NVIDIA DCGM exporter: GPU temperature, utilization, VRAM, power, and clocks.
#
# This pod must NOT request nvidia.com/gpu. vLLM already holds the only GPU. The pod
# uses the nvidia runtime class and NVIDIA_VISIBLE_DEVICES=all. The runtime then shows
# the GPU to the pod for telemetry only, and the device plugin allocation stays free.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels: { app: dcgm-exporter }
spec:
  selector:
    matchLabels: { app: dcgm-exporter }
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: { app: dcgm-exporter }
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
          imagePullPolicy: IfNotPresent
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
            - name: NVIDIA_DISABLE_REQUIRE
              value: "true"
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
          ports:
            - name: metrics
              containerPort: 9400
          resources:
            requests: { cpu: "50m", memory: 256Mi }
            limits: { cpu: "250m", memory: 640Mi }
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]   # DCGM needs it for some profiling fields
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - { name: pod-gpu-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true }
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels: { app: dcgm-exporter }
spec:
  type: ClusterIP
  selector: { app: dcgm-exporter }
  ports:
    - name: metrics
      port: 9400
      targetPort: metrics
