# Alert rules as code. Prometheus loads them from /etc/prometheus-rules.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: genai
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Scrape target {{ $labels.job }} is down"
              description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }})."

          - alert: VllmPreemptions
            expr: sum(increase(vllm:num_preemptions_total[5m])) > 0
            labels:
              severity: warning
            annotations:
              summary: "vLLM preempted requests"
              description: "vLLM threw away KV cache and recomputed it. Lower --max-num-seqs or --max-model-len."

          - alert: GpuTooHot
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "GPU temperature is above 85 C"
              description: "GPU {{ $labels.gpu }} is at {{ $value }} C."

          - alert: KvCacheNearFull
            expr: max(vllm:kv_cache_usage_perc) > 0.9
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "vLLM KV cache is above 90 percent"
              description: "New requests wait or get preempted when the KV cache is full."

          - alert: RouterDown
            # A pod that is gone has no "up" series, so the replicas of the Deployment count too.
            expr: up{job="router"} == 0 or kube_deployment_status_replicas_available{namespace="default",deployment="router"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "The router is down"
              description: "Prometheus cannot scrape the router. Open WebUI cannot reach a vLLM pod."

          - alert: RouterNoReadyPod
            # No series at all (every pod is gone) counts too, but only when the router itself is up.
            expr: (sum(router_pod_up) == 0 or absent(router_pod_up)) and on() (up{job="router"} == 1)
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "The router has no ready vLLM pod"
              description: "Every pod of the pool is down or not ready. The router answers 503."
