# kube-state-metrics: pod phase, restarts, and Deployment state as metrics.
# It collects only the resources that the dashboard needs. It has no access to Secrets.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kube-state-metrics }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      enableServiceLinks: false
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          imagePullPolicy: IfNotPresent
          args:
            # Collect only what the dashboard uses. The role above matches this list.
            - --resources=pods,deployments,daemonsets,nodes,namespaces,persistentvolumeclaims
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests: { cpu: "20m", memory: 64Mi }
            limits: { cpu: "200m", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 8081 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics }
spec:
  type: ClusterIP
  selector: { app: kube-state-metrics }
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
