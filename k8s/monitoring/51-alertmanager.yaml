# Alertmanager. It has no notification channel. Read the alerts in its web page.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: "none"
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: "none"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app: alertmanager }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests: { cpu: "20m", memory: 64Mi }
            limits: { cpu: "200m", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app: alertmanager }
spec:
  type: ClusterIP
  selector: { app: alertmanager }
  ports:
    - name: http
      port: 9093
      targetPort: http
