# Open WebUI frontend. The chat backend is the vllm Service.
# Open it from the Mac through an SSH tunnel to the NodePort (see docs/setup.md).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  labels: { app: open-webui }
spec:
  type: ClusterIP
  selector: { app: open-webui }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: webui-nodeport
  labels: { app: open-webui }
spec:
  type: NodePort
  selector: { app: open-webui }
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels: { app: open-webui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-webui }
  strategy:
    type: Recreate   # one SQLite database: never run two pods at once
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 0
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.13.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEBUI_AUTH
              value: "false"   # one user, no login screen
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: http://vllm:8000/v1
            - name: OPENAI_API_KEY
              value: sk-nokey
            # speech to text: the stt Service
            - name: AUDIO_STT_ENGINE
              value: openai
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: http://stt:8000/v1
            - name: AUDIO_STT_OPENAI_API_KEY
              value: sk-nokey
            - name: AUDIO_STT_MODEL
              value: small.en
            # text to speech: the tts Service
            - name: AUDIO_TTS_ENGINE
              value: openai
            - name: AUDIO_TTS_OPENAI_API_BASE_URL
              value: http://tts:8000/v1
            - name: AUDIO_TTS_OPENAI_API_KEY
              value: sk-nokey
            - name: AUDIO_TTS_MODEL
              value: piper
            - name: AUDIO_TTS_VOICE
              value: en_US-lessac-medium
            # Sentence streaming: in call mode Open WebUI cuts the reply at
            # punctuation and sends one TTS request per sentence while the model
            # still writes. This needs TTS_SENTENCE_SILENCE=0 and one Piper
            # process at a time on the tts server. If sentences overlap or
            # stutter, change this value to "paragraphs" and record it in docs/setup.md.
            - name: AUDIO_TTS_SPLIT_ON
              value: punctuation
            # keep the first start light: no model updates, no web search
            - name: RAG_EMBEDDING_MODEL_AUTO_UPDATE
              value: "false"
            - name: WHISPER_MODEL_AUTO_UPDATE
              value: "false"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: webui-data }
