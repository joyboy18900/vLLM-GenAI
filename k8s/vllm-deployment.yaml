# vLLM chat pod.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi   # model weights (about 9GB) plus compile caches
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  labels:
    app: vllm
    variant: fp16
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      variant: fp16
  strategy:
    type: Recreate   # one GPU only: never run two vLLM pods at once
  template:
    metadata:
      labels:
        app: vllm
        variant: fp16
    spec:
      runtimeClassName: nvidia
      # Kubernetes adds env vars from the "vllm" Service (VLLM_PORT=tcp://...).
      # They collide with the VLLM_PORT variable of vLLM and crash the engine.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - Qwen/Qwen2.5-3B-Instruct
            - --served-model-name=Qwen/Qwen2.5-3B-Instruct
            - --dtype=float16
            - --gpu-memory-utilization=0.85   # vLLM saw 10.79 GiB free of 11.99 GiB on WSL2, so 0.92 does not start
            - --max-model-len=8192
            - --max-num-seqs=16
            - --enable-prefix-caching
            # Open WebUI sends tool_choice:"auto" on every chat request
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --host=0.0.0.0
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache/hf
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: TRITON_CACHE_DIR
              value: /cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /cache/inductor
            - name: HF_HUB_OFFLINE
              value: "0"
            # WSL2 has no UVA, and the model runner V2 stops with "UVA is not available".
            # Remove this on bare-metal Ubuntu after you test it (see docs/setup.md).
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "0"
            - name: NVIDIA_DISABLE_REQUIRE
              value: "true"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60   # up to 10 minutes: the first start downloads the model
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
